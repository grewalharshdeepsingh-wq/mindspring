name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish MindSpring APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindspring-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-release
          name: "MindSpring Android App (APK)"
          body: |
            ### MindSpring Android Mobile App 📱
            Download the standalone Android APK installer below to install and run MindSpring directly on your mobile device.
            
            **Installation Steps:**
            1. Download `mindspring.apk` to your phone or tablet.
            2. Open the downloaded file from notifications or file manager.
            3. Tap **Install** (if prompted, enable "Install unknown apps" in Settings).
            4. Launch MindSpring from your home screen or app drawer!
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
